version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jobhunt_postgres
    environment:
      POSTGRES_USER: jobhunt_user
      POSTGRES_PASSWORD: jobhunt_password
      POSTGRES_DB: jobhunt_ai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobhunt_network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: jobhunt_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobhunt_network

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jobhunt_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jobhunt.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - jobhunt_network

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobhunt_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://jobhunt_user:jobhunt_password@postgres:5432/jobhunt_ai
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobhunt_network

  # Celery Worker (for background tasks)
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobhunt_celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql://jobhunt_user:jobhunt_password@postgres:5432/jobhunt_ai
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: development
      DEBUG: "true"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - jobhunt_network

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobhunt_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgresql://jobhunt_user:jobhunt_password@postgres:5432/jobhunt_ai
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_ENV: development
      DEBUG: "true"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - jobhunt_network

  # Frontend Development Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jobhunt_frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - jobhunt_network

networks:
  jobhunt_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
