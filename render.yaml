services:
  # 1. PostgreSQL Database
  - type: psql
    name: jobhunt-postgres
    region: singapore
    plan: free # Change to starter for production
    databaseName: jobhunt_ai
    user: jobhunt_user

  # 2. Redis Cache
  - type: redis
    name: jobhunt-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction

  # 3. Backend API
  - type: web
    name: jobhunt-backend
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobhunt-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jobhunt-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: jobhunt-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: jobhunt-redis
          property: connectionString

  # 4. Celery Worker (Background tasks)
  - type: worker
    name: jobhunt-celery-worker
    env: python
    region: singapore
    buildCommand: "cd backend && pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "cd backend && celery -A app.core.celery_app worker --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jobhunt-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: jobhunt-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: jobhunt-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: jobhunt-redis
          property: connectionString

  # 5. Frontend UI
  - type: web
    name: jobhunt-frontend
    env: node
    region: singapore
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: "https://jobhunt-backend.onrender.com"
